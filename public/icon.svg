<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- App Icon Background -->
  <rect width="100" height="100" rx="22" fill="#090a0f"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#222938" stroke-width="3"/>

  <!-- Subtle Circular Orbit / Guide Ring -->
  <circle cx="50" cy="50" r="32" stroke="#171b26" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Trajectory Arc -->
  <path d="M 22 74 C 34 68, 44 48, 70 28" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Faint Particle Trail -->
  <circle cx="28" cy="71" r="2" fill="#10b981" opacity="0.4"/>
  <circle cx="40" cy="59" r="2.5" fill="#10b981" opacity="0.6"/>
  <circle cx="55" cy="42" r="3" fill="#10b981" opacity="0.8"/>

  <!-- Trajectory Apex Point -->
  <circle cx="70" cy="28" r="5" fill="#10b981"/>
  <circle cx="70" cy="28" r="9" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
</svg>
